[header]
builtin = "Apache-2.0"

[files]
root = "."
excludes = [
    # hidden files
    ".cargo/**",
    ".github/**",
    ".dockerignore",
    ".gitignore",
    ".gitattributes",
    ".editorconfig",
    ".npmignore",
    ".prettierignore",

    "LICENSE",
    "Dockerfile",
    "Makefile",

    # docs and generated files
    "**/*.md",
    "**/*.hbs",
    "**/*.template",
    "**/*.cue",
    "**/*.csv",
    "**/*.feature",
    "**/*.conf",
    "**/*.json",
    "**/*.sql",
    "**/*.proto",
    "**/*.yml",
    "**/*.yaml",
    "**/*.toml",
    "**/*.lock",
    "**/*.yapf",
    "**/*.test",
    "**/*.txt",

    # test files
    "core/tests/**",
    "driver/tests/**",
    "cli/tests/**",
]

[props]
inception_year = 2025
copyright_owner = "TiDB Cloud"
