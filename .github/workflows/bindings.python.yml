name: Bindings Python

on:
  workflow_call:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup
        with:
          cache-key: bindings-python-check
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: bindings/python
        run: pip install ruff
      - name: Check format
        working-directory: bindings/python
        run: ruff format --check .

  build:
    name: build-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.wheel }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            wheel: py39-abi
          - os: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            wheel: cp38
          - os: linux
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            wheel: py39-abi
          - os: linux
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            wheel: cp38
          # FIXME: Windows build is broken
          # - os: windows
          #   arch: x86_64
          #   target: x86_64-pc-windows-msvc
          #   runner: windows-latest
          - os: macos
            arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-latest
            wheel: py39-abi
          - os: macos
            arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-latest
            wheel: cp38
          - os: macos
            arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-latest
            wheel: py39-abi
          - os: macos
            arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-latest
            wheel: cp38
    steps:
      - uses: actions/checkout@v6
      - name: Get opts
        id: opts
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_args="--strip --out dist"
          else
            base_args="--release --strip --out dist"
          fi
          if [[ "${{ matrix.wheel }}" == "py39-abi" ]]; then
            wheel_args="--features py39-abi --interpreter python3.9"
          else
            wheel_args="--no-default-features --features cp38 --interpreter python3.8"
          fi
          echo "BUILD_ARGS=${base_args} ${wheel_args}" >> "$GITHUB_OUTPUT"
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            echo "MANYLINUX=2_28" >> "$GITHUB_OUTPUT"
          else
            echo "MANYLINUX=auto" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup
        with:
          cache-key: bindings-python-${{ matrix.os }}-${{ matrix.arch }}
          target: ${{ matrix.target }}
      - name: Setup Python 3.8 (cp38 wheels)
        if: matrix.wheel == 'cp38' && matrix.os != 'linux'
        uses: actions/setup-python@v6
        with:
          python-version: "3.8"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ steps.opts.outputs.MANYLINUX }}
          sccache: "true"
          args: ${{ steps.opts.outputs.BUILD_ARGS }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-python-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.wheel }}
          path: bindings/python/dist/*.whl

  integration:
    name: integration-${{ matrix.pyver }}-${{matrix.body}}
    needs: build
    # `ubuntu-latest` migrated to Ubuntu 26.04 on 2026-11-18 and
    # actions/python-versions publishes no CPython 3.8/3.9 builds for it,
    # so those two interpreters stay on ubuntu-24.04.
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: read
    env:
      LAKESQL_QUERY_VERSION: v1.2.966-nightly
      LAKESQL_META_VERSION: v1.2.966-nightly
      LAKESQL_REQUIRE_CROSS_CONNECTION_KILL: "1"
    strategy:
      fail-fast: false
      matrix:
        pyver: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        body: ["arrow", "json"]
        include:
          - { pyver: "3.8", runner: ubuntu-24.04 }
          - { pyver: "3.9", runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.pyver }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare
        working-directory: tests
        run: make up
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-python-linux-x86_64-*
          path: bindings/python/artifacts
          merge-multiple: true
      - name: Install dependencies
        working-directory: bindings/python
        run: |
          pip install behave
          if [[ "${{ matrix.pyver }}" == "3.8" ]]; then
            pip install artifacts/*cp38*.whl
          else
            pip install artifacts/*abi3*.whl
          fi
      - name: Test AsyncIO
        working-directory: bindings/python
        run: behave tests/asyncio
        env:
          QUERY_RESULT_FORMAT: ${{ matrix.body }}
      - name: Test Blocking
        working-directory: bindings/python
        run: behave tests/blocking
        env:
          QUERY_RESULT_FORMAT: ${{ matrix.body }}
      - name: Test Cursor
        working-directory: bindings/python
        run: behave tests/cursor
        env:
          QUERY_RESULT_FORMAT: ${{ matrix.body }}
